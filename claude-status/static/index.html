<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Status</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6963;
    --border: rgba(0,0,0,.10);
    --gray: #a3a19b; --yellow: #e2a400; --green: #2f9e57; --red: #d6402f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #212120; --text: #ecebe7; --muted: #9c9a93;
            --border: rgba(255,255,255,.10); --gray: #6c6a65; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 32px 0 10px; font-weight: 600; }
  .conn { margin-left: auto; font-size: 13px; color: var(--muted); }
  .tools { display: flex; gap: 8px; margin: -8px 0 16px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--border);
         border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .conn.down { color: var(--red); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
  .card .actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .card:hover .actions { opacity: 1; }
  .icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 6px; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  @media (hover: none) { .card .actions { opacity: 1; } }
  .card.ended { opacity: .55; }
  .light { width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--gray); }
  .light.yellow { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  .light.green  { background: var(--green);  box-shadow: 0 0 10px var(--green); }
  .light.green.fresh { animation: flash .9s ease-in-out infinite; animation-delay: var(--phase, 0s); }
  @keyframes flash { 50% { opacity: .2; box-shadow: none; } }
  .light.yellow::after { content: ""; display: block; width: 34px; height: 34px; margin: -4px; border-radius: 50%;
          border: 2px solid transparent; border-top-color: var(--yellow); animation: spin .9s linear infinite; animation-delay: var(--phase, 0s); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .light.red    { background: var(--red);    box-shadow: 0 0 14px var(--red); animation: pulse .6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .info { min-width: 0; }
  .project { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
           border: 1px solid var(--border); margin-right: 6px; color: var(--text); }
  .empty { color: var(--muted); padding: 20px; border: 1px dashed var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.sid { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .log { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  body.one-account .badge, body.one-account .acc { display: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gray); margin-right: 6px; }
  .dot.yellow { background: var(--yellow); } .dot.green { background: var(--green); } .dot.red { background: var(--red); }
</style>
</head>
<body>
<main>
  <header>
    <div class="light" id="overall"></div>
    <h1>Sesiones de Claude Code</h1>
    <span class="conn" id="conn">conectando…</span>
  </header>
  <div class="tools">
    <button class="btn" id="sound" data-action="sound">🔔 Sonido</button>
    <button class="btn" data-action="clean">🧹 Limpiar terminadas</button>
  </div>
  <div class="grid" id="cards"></div>

  <h2>Últimos 50 eventos</h2>
  <div class="log">
    <table>
      <thead><tr><th>Hora</th><th class="acc">Cuenta</th><th>Proyecto</th><th>Evento</th><th>Estado</th><th>Sesión</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
  </div>
</main>
<script>
const COLOR = { attention: "red", working: "yellow", done: "green", ended: "gray", unknown: "gray" };
const LABEL = { attention: "necesita algo", working: "trabajando", done: "terminó", ended: "sesión cerrada", unknown: "sin datos" };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function ago(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 5) return "recién";
  if (sec < 60) return `hace ${sec} s`;
  if (sec < 3600) return `hace ${Math.floor(sec / 60)} min`;
  return `hace ${Math.floor(sec / 3600)} h ${Math.floor((sec % 3600) / 60)} min`;
}
function hhmmss(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

// La etiqueta de cuenta solo se muestra si hay más de una cuenta distinta.
function setAccountVisibility(st, events) {
  const accounts = new Set([...st.sessions, ...events].map(x => x.account));
  document.body.classList.toggle("one-account", accounts.size <= 1);
}

async function post(path, body) {
  await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  tick();
}

let lastState = null;
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const { action, account, sid } = el.dataset;
  if (action === "forget") post("/session/forget", { account, session_id: sid });
  if (action === "clean") post("/sessions/clean");
  if (action === "sound") post("/config", { sound: !(lastState && lastState.sound) });
  if (action === "rename") {
    const s = lastState.sessions.find(x => x.account === account && x.session_id === sid);
    const name = prompt("Nombre para esta sesión (vacío = nombre de la carpeta):", s ? s.name : "");
    if (name !== null) post("/session/rename", { account, session_id: sid, name });
  }
});

function renderState(st) {
  lastState = st;
  // La página se redibuja cada segundo: con este desfase las animaciones siguen sin saltar.
  const phase = `--phase:-${(Date.now() % 900) / 1000}s`;
  document.getElementById("sound").textContent = st.sound ? "🔔 Sonido activado" : "🔕 Sonido apagado";
  document.getElementById("overall").className = "light " + st.overall_color;
  const cards = document.getElementById("cards");
  if (!st.sessions.length) {
    cards.innerHTML = '<div class="empty">Sin sesiones abiertas. Mandá un prompt en Claude Code o corré <code>./test-events.sh</code>.</div>';
    return;
  }
  cards.innerHTML = st.sessions.map(s => `
    <div class="card ${s.status === "ended" ? "ended" : ""}">
      <div class="actions">
        <button class="icon-btn" title="Renombrar" data-action="rename" data-account="${esc(s.account)}" data-sid="${esc(s.session_id)}">✎</button>
        <button class="icon-btn" title="Quitar de la lista" data-action="forget" data-account="${esc(s.account)}" data-sid="${esc(s.session_id)}">✕</button>
      </div>
      <div class="light ${COLOR[s.status] || "gray"} ${s.status === "done" && s.status_age_s < 8 ? "fresh" : ""}" style="${phase}" title="${esc(LABEL[s.status])}"></div>
      <div class="info">
        <div class="project" title="${esc(s.name)}">${esc(s.name)}</div>
        <div class="meta"><span class="badge">${esc(s.account)}</span>${esc(LABEL[s.status] || s.status)}</div>
        <div class="meta">${esc(s.last_event)} · ${ago(s.age_s)}${s.name !== s.project ? " · " + esc(s.project) : ""}</div>
      </div>
    </div>`).join("");
}

function renderLog(events) {
  document.getElementById("log").innerHTML = events.map(e => `
    <tr>
      <td>${hhmmss(e.timestamp)}</td>
      <td class="acc">${esc(e.account)}</td>
      <td>${esc(e.project)}</td>
      <td>${esc(e.event)}${e.notification_type ? ` <span class="meta">(${esc(e.notification_type)})</span>` : ""}</td>
      <td><span class="dot ${COLOR[e.status] || "gray"}"></span>${esc(LABEL[e.status] || e.status)}</td>
      <td class="sid">${esc(String(e.session_id).slice(0, 8))}</td>
    </tr>`).join("");
}

async function tick() {
  const conn = document.getElementById("conn");
  try {
    const [st, ev] = await Promise.all([
      fetch("/state", { cache: "no-store" }).then(r => r.json()),
      fetch("/events", { cache: "no-store" }).then(r => r.json()),
    ]);
    setAccountVisibility(st, ev);
    renderState(st);
    renderLog(ev);
    conn.textContent = "en vivo · " + new Date().toLocaleTimeString();
    conn.classList.remove("down");
  } catch (err) {
    conn.textContent = "servidor caído";
    conn.classList.add("down");
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
